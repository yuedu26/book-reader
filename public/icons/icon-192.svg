<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6E6F6"/>
      <stop offset="0.7" stop-color="#EAF6FA"/>
      <stop offset="1" stop-color="#FFF3D6"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE49C"/>
      <stop offset="1" stop-color="#A8D98B"/>
    </linearGradient>
  </defs>

  <!-- 背景天空 -->
  <rect width="192" height="192" rx="40" fill="url(#sky)"/>

  <!-- 晨光太阳 -->
  <circle cx="38" cy="40" r="24" fill="#FFF3C4" opacity="0.6"/>
  <circle cx="38" cy="40" r="15" fill="#FFE89A"/>

  <!-- 远处的云 -->
  <g fill="#FFFFFF" opacity="0.7">
    <ellipse cx="150" cy="34" rx="20" ry="8"/>
    <ellipse cx="163" cy="30" rx="13" ry="6"/>
  </g>

  <!-- 草地 -->
  <path d="M0 138 Q 48 130 96 138 T 192 134 L 192 192 L 0 192 Z" fill="url(#grass)"/>

  <!-- 房子 -->
  <g>
    <polygon points="14,102 44,76 74,102" fill="#E0A068"/>
    <rect x="20" y="102" width="48" height="40" rx="2" fill="#FFF7EC"/>
    <rect x="38" y="120" width="12" height="22" rx="2" fill="#C08A58"/>
    <rect x="26" y="112" width="9" height="9" rx="1" fill="#A9D7F2"/>
    <rect x="56" y="112" width="9" height="9" rx="1" fill="#A9D7F2"/>
  </g>

  <!-- 柚子树 -->
  <g>
    <rect x="136" y="102" width="10" height="38" rx="4" fill="#9C7A5A"/>
    <circle cx="132" cy="88" r="26" fill="#86C64E"/>
    <circle cx="152" cy="90" r="26" fill="#7FBE4E"/>
    <circle cx="142" cy="70" r="24" fill="#8CCB52"/>
    <!-- 柚子 -->
    <circle cx="126" cy="98" r="8" fill="#FFD54F"/>
    <circle cx="152" cy="102" r="8" fill="#FFD54F"/>
    <circle cx="140" cy="84" r="8" fill="#FFC93C"/>
    <!-- 柚子高光 -->
    <circle cx="124" cy="96" r="2" fill="#FFF3C4"/>
    <circle cx="150" cy="100" r="2" fill="#FFF3C4"/>
  </g>

  <!-- 小男孩坐在树下读书 -->
  <g>
    <!-- 身体（蓝衣） -->
    <rect x="88" y="124" width="18" height="18" rx="7" fill="#5C8BC4"/>
    <!-- 腿 -->
    <rect x="90" y="140" width="6" height="12" rx="3" fill="#4E6E9C"/>
    <rect x="100" y="140" width="6" height="12" rx="3" fill="#4E6E9C"/>
    <!-- 头 -->
    <circle cx="97" cy="112" r="10" fill="#F6D3A8"/>
    <!-- 头发 -->
    <path d="M87 110 a10 10 0 0 1 20 0 l0 -4 a10 7 0 0 0 -20 0 z" fill="#5D4037"/>
    <!-- 打开的书 -->
    <g fill="#FFFFFF" stroke="#D9C7A8" stroke-width="0.8">
      <path d="M86 124 l10 3 l10 -3 l0 9 l-10 3 l-10 -3 z"/>
      <line x1="96" y1="127" x2="96" y2="136" stroke="#D9C7A8" stroke-width="1"/>
    </g>
  </g>
</svg>
