<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C6E6F6"/>
      <stop offset="0.7" stop-color="#EAF6FA"/>
      <stop offset="1" stop-color="#FFF3D6"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE49C"/>
      <stop offset="1" stop-color="#A8D98B"/>
    </linearGradient>
  </defs>

  <!-- 背景天空 -->
  <rect width="512" height="512" rx="100" fill="url(#sky)"/>

  <!-- 晨光太阳 -->
  <circle cx="101" cy="107" r="64" fill="#FFF3C4" opacity="0.6"/>
  <circle cx="101" cy="107" r="40" fill="#FFE89A"/>

  <!-- 远处的云 -->
  <g fill="#FFFFFF" opacity="0.7">
    <ellipse cx="400" cy="91" rx="53" ry="21"/>
    <ellipse cx="435" cy="80" rx="35" ry="16"/>
  </g>

  <!-- 草地 -->
  <path d="M0 368 Q 128 347 256 368 T 512 357 L 512 512 L 0 512 Z" fill="url(#grass)"/>

  <!-- 房子 -->
  <g>
    <polygon points="37,272 117,203 197,272" fill="#E0A068"/>
    <rect x="53" y="272" width="128" height="107" rx="5" fill="#FFF7EC"/>
    <rect x="101" y="320" width="32" height="59" rx="5" fill="#C08A58"/>
    <rect x="69" y="299" width="24" height="24" rx="3" fill="#A9D7F2"/>
    <rect x="149" y="299" width="24" height="24" rx="3" fill="#A9D7F2"/>
  </g>

  <!-- 柚子树 -->
  <g>
    <rect x="363" y="272" width="27" height="101" rx="11" fill="#9C7A5A"/>
    <circle cx="352" cy="235" r="69" fill="#86C64E"/>
    <circle cx="405" cy="240" r="69" fill="#7FBE4E"/>
    <circle cx="379" cy="187" r="64" fill="#8CCB52"/>
    <!-- 柚子 -->
    <circle cx="336" cy="261" r="21" fill="#FFD54F"/>
    <circle cx="405" cy="272" r="21" fill="#FFD54F"/>
    <circle cx="373" cy="224" r="21" fill="#FFC93C"/>
    <!-- 柚子高光 -->
    <circle cx="331" cy="256" r="5" fill="#FFF3C4"/>
    <circle cx="400" cy="267" r="5" fill="#FFF3C4"/>
  </g>

  <!-- 小男孩坐在树下读书 -->
  <g>
    <!-- 身体（蓝衣） -->
    <rect x="235" y="331" width="48" height="48" rx="19" fill="#5C8BC4"/>
    <!-- 腿 -->
    <rect x="240" y="373" width="16" height="32" rx="8" fill="#4E6E9C"/>
    <rect x="267" y="373" width="16" height="32" rx="8" fill="#4E6E9C"/>
    <!-- 头 -->
    <circle cx="259" cy="299" r="27" fill="#F6D3A8"/>
    <!-- 头发 -->
    <path d="M232 293 a27 27 0 0 1 54 0 l0 -11 a27 19 0 0 0 -54 0 z" fill="#5D4037"/>
    <!-- 打开的书 -->
    <g fill="#FFFFFF" stroke="#D9C7A8" stroke-width="2">
      <path d="M229 331 l27 8 l27 -8 l0 24 l-27 8 l-27 -8 z"/>
      <line x1="256" y1="339" x2="256" y2="363" stroke="#D9C7A8" stroke-width="3"/>
    </g>
  </g>
</svg>
